<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe Code Photo Feed</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Breathe Code Photo Feed</h1>
    </header>

    <main class="feed-container">
        <article class="post">
            <div class="post-header">
                <h2>My first photo</h2>
                <span>12/14</span>
            </div>
            
            <div class="post-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN4HJhnJo07reTM0Lta1HoTollHloqsqRUVw&s" alt="Puppy">
            </div>

            <div class="post-body">
                <p>This is my first photo of the feed. this is a multi line comment for testing purposes. I am learning to code with #BreatheCode</p>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <h2>Some cute thing</h2>
                <span>12/17</span>
            </div>
            
            <div class="post-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN4HJhnJo07reTM0Lta1HoTollHloqsqRUVw&s" alt="Trees">
            </div>

            <div class="post-body">
                <p>The feed continues here with more awesome content.</p>
            </div>

    </main>

</body>
</html>
